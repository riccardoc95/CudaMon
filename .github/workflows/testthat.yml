name: Testthat

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  workflow_dispatch:

jobs:
  test-base:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            r-cran-testthat \
            r-cran-ggplot2 \
            r-cran-processx

      - name: Install package
        run: R CMD INSTALL .

      - name: Run test-base.R
        run: Rscript -e 'source("tests/testthat/helper-gpu.R"); testthat::test_file("tests/testthat/test-base.R")'
