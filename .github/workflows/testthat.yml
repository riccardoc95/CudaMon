name: Testthat

on:
  push:
  workflow_dispatch:

jobs:
  test-base:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::ggplot2
            any::processx

      - name: Install package
        run: R CMD INSTALL .

      - name: Run test-base.R
        run: Rscript -e 'source("tests/testthat/helper-gpu.R"); testthat::test_file("tests/testthat/test-base.R")'
