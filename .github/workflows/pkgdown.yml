name: Pkgdown

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install R from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            r-base \
            r-base-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: |
          mkdir -p "${R_LIBS_USER}"
          Rscript -e '
            pkgs <- c(
              "pkgdown", "downlit", "evaluate", "ggplot2", "knitr",
              "processx", "rmarkdown", "roxygen2", "testthat"
            )
            install.packages(
              pkgs,
              repos = "https://cloud.r-project.org",
              lib = Sys.getenv("R_LIBS_USER")
            )
          '

      - name: Write pkgdown sidebar
        run: |
          cat > sidebar.html <<'EOF'
          <div class="pkgdown-sidebar">
            <p>Documentation site for the CudaMon R package. </p>
          </div>
          EOF

      - name: Build pkgdown site
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./docs
