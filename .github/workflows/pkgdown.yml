name: Pkgdown

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install R and dependencies from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            r-base \
            r-base-dev \
            r-cran-roxygen2 \
            r-cran-ggplot2 \
            r-cran-processx

      - name: Install pkgdown
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: |
          mkdir -p "${R_LIBS_USER}"
          Rscript -e 'install.packages("pkgdown", repos = "https://cloud.r-project.org", lib = Sys.getenv("R_LIBS_USER"))'

      - name: Build pkgdown site
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./docs
